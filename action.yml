name: 'EKS Deploy'
inputs:
  aws-access-key-id:
    required: true
  aws-secret-access-key:
    required: true
  aws-region:
    required: true
  cluster-name:
    required: true
  docker-image-name:
    required: true
  docker-image-tag:
    required: true
  eks-app-name:
    required: true
  eks-namespace:
    required: true
runs:
  using: "composite"
  steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ inputs.aws-access-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
        aws-region: ${{ inputs.aws-region }}
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
    - name: Deploy ${{ inputs.docker-image-tag }} to Kubernetes cluster
      shell: bash
      env:
        RELEASE_IMAGE: ${{ steps.login-ecr.outputs.registry }}/${{ inputs.docker-image-name }}:${{ inputs.docker-image-tag }}
      run: |
        docker run --rm \
          -e INPUT_AWS_ACCESS_KEY_ID='${{ inputs.aws-access-key-id }}' \
          -e INPUT_AWS_SECRET_ACCESS_KEY='${{ inputs.aws-secret-access-key }}' \
          -e INPUT_AWS_REGION='${{ inputs.aws-region }}' \
          -e INPUT_CLUSTER_NAME='${{ inputs.cluster-name }}' \
          -e "INPUT_ARGS=set image deployment/${{ inputs.eks-app-name }} ${{ inputs.eks-app-name }}=${RELEASE_IMAGE} -n ${{ inputs.eks-namespace }}" \
          034997445696.dkr.ecr.cn-north-1.amazonaws.com.cn/ci/eks-kubectl-action:latest
    - name: Verify Kubernetes deployment
      if: ${{ ! contains(inputs.eks-namespace, 'dev') }}
      shell: bash
      run: |
        docker run --rm \
          -e INPUT_AWS_ACCESS_KEY_ID='${{ inputs.aws-access-key-id }}' \
          -e INPUT_AWS_SECRET_ACCESS_KEY='${{ inputs.aws-secret-access-key }}' \
          -e INPUT_AWS_REGION='${{ inputs.aws-region }}' \
          -e INPUT_CLUSTER_NAME='${{ inputs.cluster-name }}' \
          -e "INPUT_ARGS=rollout status deployment/${{ inputs.eks-app-name }} -n ${{ inputs.eks-namespace }}" \
          034997445696.dkr.ecr.cn-north-1.amazonaws.com.cn/ci/eks-kubectl-action:latest